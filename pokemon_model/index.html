<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pokemon card guesser</title>
    <style>
       

        body{
            background: #ffffff;
            color: #111111;
            display: flex;
            flex-direction:column;
            align-items:center;
            padding: 60px 20px 80px;
            font-family: 'Trebuchet MS', sans-serif;
        }
        h1{
            font-size: 32px;
            font-weight:400;
            margin-bottom:40px;
            text-align:center;
        }
        #status{
            font-size: 20px;
            margin:32px 0;
            min-height:28px; 
        }
        #webcam{
            margin: 8px 0 40px;
            width:300px;
            height:300px;
            border: 2px solid #111111;
            overflow:hidden;
            line-height:0;
        }
        #result{
            text-align: center;
            max-width: 400px;
        }
        #result h2{
            font-size: 24px;
            font-weight: 400;
            margin:0 0 8px;
            text-transform:capitalize;
        }
        #result p{
            font-size:16px;
            font-family: 'Trebuchet MS', sans-serif;
            margin:0 0 20px;
        }
    </style>
</head>
<body>
    <h1>place your card in the camera!</h1>
    <div id="webcam"></div>
    <div id="status">waiting for camera</div>
    <div id="result">
    <h2 id="card_name"></h2>
    <p id="card_pack"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
    
    <script>
        const url= "https://teachablemachine.withgoogle.com/models/83XP-ZHQR/";
        
        const confidence_threshold= 0.85;
        
        const card_info={
        "slowpoke": {pack:"Abyss Eye"},
        "goldeen": {pack: "Abyss Eye"},
        "charcadet": {pack: "Abyss Eye"}
        };

        const back="card_back";
        let model, webcam, max_predictions;
        
        let last_label=null;
        let stable_count=0;
        const stable_frame=8;

        async function init(){
            const model_url= url+ "model.json";
            const metadata_url= url+ "metadata.json";

            model = await tmImage.load(model_url, metadata_url);
            max_predictions= model.getTotalClasses();

            webcam= new tmImage.Webcam(300, 300, true);
            await webcam.setup();
            await webcam.play();
            window.requestAnimationFrame(loop);

            document.getElementById("webcam").appendChild(webcam.canvas);
            document.getElementById("status").innerText= "show your card";

        }

        async function loop(){
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict(){
            const prediction= await model.predict(webcam.canvas);

            let best= prediction[0];
            for(let i=1; i<prediction.length; i++){
                if(prediction[i].probability > best.probability){
                    best= prediction[i];
                }
            }

            const status_el= document.getElementById("status");
            const name_el=document.getElementById("card_name");
            const pack_el= document.getElementById("card_pack");

            const current_label= (best.probability < confidence_threshold)? "none": best.className;

            if(current_label=== last_label){
                stable_count++;
            }
            else{
                stable_count=0;
                last_label= current_label;
            }
            if(stable_count< stable_frame){
                return;
            }
            if(current_label==="none"){
                status_el.innerText="show your card";
                name_el.innerText="";
                pack_el.innerText="";
                return;
            }

            if(current_label===back){
                status_el.innerText= "flip it";
                name_el.innerText="";
                pack_el.innerText="";
                return;
            }

            const card= card_info[current_label];
            if(card){
                status_el.innerText="";
                name_el.innerText= current_label;
                pack_el.innerText=" its from " + card.pack;
            }
            else{
                status_el.innerText="recognized:" +current_label;
            }

        }
        
        window.addEventListener("load", init);

    </script>
</body>
</html>
